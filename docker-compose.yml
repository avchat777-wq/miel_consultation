services:
  miel-consultation:
    build: .
    container_name: miel-consultation
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8030:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

