# PROPOSED snippet inside the existing HTTPS server for consultation.ml22.ru.
# NOT deployed. Keep the existing location / for miel-consultation unchanged.
# The admin endpoint is intentionally unavailable via the public hostname.
# Administration must use authenticated SSH local port forwarding to 127.0.0.1:8070.

location ^~ /invite/admin/ {
    return 404;
}

location ^~ /invite/ {
    proxy_pass http://127.0.0.1:8070;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
}

# Deliberately no proxy route for /invite/admin/ over the public hostname.
# Verify nginx -t before applying; test the protected path returns 404.
